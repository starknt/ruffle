version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "T-chore"
      - "A-deps"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      winit-wgpu-egui:
        patterns:
        - "winit"
        - "wgpu"
        - "naga"
        - "egui*"
        - "raw-window-handle"
      cargo-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "T-chore"
      - "A-deps"
