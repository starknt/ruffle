[package]
name = "tests"
authors = ["Aaron Hill <aa1ronham@gmail.com>"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["avm_debug"]
# Allow optimized execution regressions to exercise release-only fast paths.
avm_debug = ["ruffle_core/avm_debug", "ruffle_test_framework/avm_debug"]
# Enable running image comparison tests. This is off by default,
# since the images we compare against are generated on CI, and may
# not match your local machine's Vulkan version / image output.
imgtests = [
    "ruffle_render_wgpu",
    "ruffle_test_framework/ruffle_video_software",
    "ruffle_test_framework/ruffle_video_external",
]
freetype = ["ruffle_test_framework/freetype"]
jpegxr = ["ruffle_test_framework/jpegxr"]
lzma = ["ruffle_test_framework/lzma"]

[dependencies]
ruffle_render_wgpu = { path = "../render/wgpu", optional = true }
ruffle_fs_tests_runner = { path = "fs-tests-runner" }
ruffle_test_framework = { path = "framework", default-features = false, features = ["clap"] }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
ruffle_render = { path = "../render", features = ["serde"] }
image = { workspace = true, features = ["png"] }
temp-dir = "0.2.0"
ruffle_core = { path = "../core" }

[dev-dependencies]
ruffle_core = { path = "../core", features = ["timeline_debug", "audio", "mp3", "aac", "default_font"] }
libtest-mimic = { workspace = true }
futures = { workspace = true }
env_logger = "0.11.10"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[test]]
name = "tests"
harness = false
path = "tests/regression_tests.rs"

[[bin]]
name = "native-perf"
path = "src/bin/native-perf.rs"
required-features = ["imgtests"]
