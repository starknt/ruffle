[package]
name = "ruffle_render_wgpu"
authors = ["Nathan Adams <dinnerbone@dinnerbone.com>"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
wgpu = { workspace = true, features = ["naga-ir"] }
tracing = { workspace = true }
ruffle_render = { path = "..", features = ["tessellator", "wgpu"] }
bytemuck = { workspace = true, features = ["derive"] }
clap = { workspace = true, optional = true }
enum-map = { workspace = true }
fnv = { workspace = true }
swf = { path = "../../swf" }
image = { workspace = true }
naga-agal = { path = "../naga-agal" }
naga-pixelbender = { path = "../naga-pixelbender" }
profiling = { version = "1.0", default-features = false, optional = true }
lru = "0.18.2"
naga = { workspace = true }
indexmap = { workspace = true }
smallvec = { workspace = true }
parking_lot = "0.12"
once_cell = "1"
thiserror.workspace = true
tracy-client = { version = "0.18", optional = true }
futures = { workspace = true }
rayon = { workspace = true }
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[features]
render_debug_labels = []
profile-with-tracy = ["profiling", "profiling/profile-with-tracy", "dep:tracy-client"]
tracy_images = ["profile-with-tracy"]

[package.metadata.cargo-machete]
ignored = [
    # Not used directly, declared only to enable its `profile-with-tracy` feature.
    "profiling"
]
